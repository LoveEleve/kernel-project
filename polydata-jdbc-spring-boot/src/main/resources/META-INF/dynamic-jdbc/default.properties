# Dynamic JDBC Default Properties

## baomidou Dynamic DataSource
spring.datasource.dynamic.enabled = false

## Dynamic JDBC Modules Default Properties

### DataSource Module
polydata.jdbc.modules.datasource.auto-configuration.base-packages = org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceConfiguration

polydata.jdbc.modules.datasource.auto-configuration.banned-modules = sharding-sphere

polydata.jdbc.modules.datasource.property-name-aliases.url = jdbcUrl,jdbc-url
polydata.jdbc.modules.datasource.property-name-aliases.jdbcUrl = url,jdbc-url
polydata.jdbc.modules.datasource.property-name-aliases.jdbc-url = url,jdbcUrl

polydata.jdbc.modules.datasource.url.default-scheme = mysql\://
polydata.jdbc.modules.datasource.url.default-query-params.characterEncoding = utf-8
polydata.jdbc.modules.datasource.url.default-query-params.useSSL = false
polydata.jdbc.modules.datasource.url.default-query-params.useUnicode = true

### HA DataSource Module
polydata.jdbc.modules.ha-datasource.auto-configuration.banned-modules = sharding-sphere

### Transaction Module
polydata.jdbc.modules.transaction.auto-configuration.base-packages = org.springframework.boot.autoconfigure.transaction.,\
org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

### ShardingSphere Module
polydata.jdbc.modules.sharding-sphere.dynamic.enabled = true
polydata.jdbc.modules.sharding-sphere.auto-configuration.base-packages = org.apache.shardingsphere.
polydata.jdbc.modules.sharding-sphere.auto-configuration.banned-modules = datasource
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.maxLifetime = 1800000
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.idleTimeout = 600000
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.connectionTimeout = 30000
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.validationTimeout = 10000
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.maxPoolSize = 10

# minIdle for Hikari
polydata.jdbc.modules.sharding-sphere.default-properties.datasource.minPoolSize = 10

### MyBatis Module
polydata.jdbc.modules.mybatis.auto-configuration.base-packages = org.mybatis.spring.boot.
polydata.jdbc.modules.mybatis.auto-configuration.banned-modules = mybatis-plus

### MyBatis Module
polydata.jdbc.modules.mybatis-plus.auto-configuration.base-packages = com.baomidou.
polydata.jdbc.modules.mybatis-plus.auto-configuration.banned-modules = mybatis

## Multiple Context
polydata.jdbc.multiple-context.auto-configuration.exclude = \
org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration,\
org.mybatis.spring.boot.autoconfigure.MybatisLanguageDriverAutoConfiguration,\
com.baomidou.mybatisplus.autoconfigure.MybatisPlusAutoConfiguration,\
com.baomidou.mybatisplus.autoconfigure.MybatisPlusLanguageDriverAutoConfiguration,\
org.apache.shardingsphere.dbdiscovery.spring.boot.DatabaseDiscoveryRuleSpringbootConfiguration,\
org.apache.shardingsphere.encrypt.spring.boot.EncryptRuleSpringBootConfiguration,\
org.apache.shardingsphere.parser.spring.boot.SQLParserRuleSpringBootConfiguration,\
org.apache.shardingsphere.readwritesplitting.spring.boot.ReadwriteSplittingRuleSpringbootConfiguration,\
org.apache.shardingsphere.shadow.spring.boot.ShadowRuleSpringBootConfiguration,\
org.apache.shardingsphere.sharding.spring.boot.ShardingRuleSpringBootConfiguration,\
org.apache.shardingsphere.spring.boot.ShardingSphereAutoConfiguration,\
org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

polydata.jdbc.multiple-context.bean-classes.expose = javax.sql.DataSource,\
org.springframework.transaction.PlatformTransactionManager,\
org.springframework.boot.autoconfigure.transaction.TransactionManagerCustomizers,\
org.apache.ibatis.session.SqlSessionFactory

polydata.jdbc.multiple-context.bean-classes.primary = javax.sql.DataSource,\
org.springframework.transaction.PlatformTransactionManager,\
org.springframework.boot.autoconfigure.transaction.TransactionManagerCustomizers,\
org.apache.ibatis.session.SqlSessionFactory
