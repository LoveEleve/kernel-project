# H2-backed multiple DynamicJdbcConfigs: MyBatis and MyBatis-Plus coexisting in the same process

polydata.jdbc.configs.mybatis={"name":"coexist-mybatis","datasource":[{"name":"ds","url":"jdbc:h2:mem:polydata-orm-mybatis;DB_CLOSE_DELAY=-1"}],"mybatis":{"base-packages":"io.github.loveeleve.polydata.datasource.orm.mybatis.mapper"}}

polydata.jdbc.configs.mybatisplus={"name":"coexist-mybatis-plus","datasource":[{"name":"ds","url":"jdbc:h2:mem:polydata-orm-mybatisplus;DB_CLOSE_DELAY=-1"}],"mybatis-plus":{"base-packages":"io.github.loveeleve.polydata.datasource.orm.mybatisplus.mapper"}}

polydata.jdbc.modules.datasource.default-user-name=sa

polydata.jdbc.modules.datasource.default-password=sa
