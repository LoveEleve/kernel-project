# H2-backed single DynamicJdbcConfig with ShardingSphere for tests

polydata.jdbc.configs.primary={"name":"h2-sharding","datasource":[{"name":"ds","url":"jdbc:h2:mem:polydata-sharding;DB_CLOSE_DELAY=-1"}],"sharding-sphere":{"config-resource":"classpath:/META-INF/sharding-sphere/config/sharding-tables.yaml"}}

polydata.jdbc.modules.datasource.default-user-name=sa

polydata.jdbc.modules.datasource.default-password=sa
