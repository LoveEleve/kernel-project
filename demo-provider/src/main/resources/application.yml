server:
  port: 8081

spring:
  application:
    name: demo-provider
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848      # 本机 Nacos（见 docs/gateway/infra-nacos.md）
        # ★ L16 准备：实例 metadata（注册时随实例上报，网关的 LoadBalancer 会读它）
        metadata:
          zone: shanghai
          version: v1
    # ★ L45 实验 C：服务层 Sentinel（eager 启动初始化；transport 端口与网关 8719 错开）
    sentinel:
      eager: true
      transport:
        port: 8720

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.myxhs.demo: DEBUG
