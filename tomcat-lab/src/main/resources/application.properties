# tomcat-lab 默认端口（避开 demo-provider 8081 / demo-gateway 8080）
server.port=18080

# 优雅停机：Boot 3.2.5 默认是 immediate（见 3.2.5 元数据），这里显式打开
server.shutdown=graceful

# 每个关闭 phase 的等待上限（Boot 默认 30s；Spring Framework 自身默认 10s）
spring.lifecycle.timeout-per-shutdown-phase=30s

# 09 篇：打开 Tomcat MBean 注册（Boot 默认关），让 JMX/actuator 能看到线程池与连接指标
server.tomcat.mbeanregistry.enabled=true
# 暴露 actuator 指标端点（/actuator/metrics/tomcat.threads.busy 等）
management.endpoints.web.exposure.include=health,metrics

# 想看 Tomcat 内部日志可打开（调试用）
# logging.level.org.apache.catalina=DEBUG
# logging.level.org.apache.coyote=DEBUG
